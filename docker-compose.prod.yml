version: '3.8'
services:
  smart-money-bot:
    image: smart-money-bot:latest
    container_name: smart-money-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    deploy:
      resources:
        limits:
          memory: 512M
